name: Sync gallery

# Runs only when someone asks for it:
#  - the Refresh button on the website (via the worker, see worker/index.js)
#  - the "Run workflow" button on GitHub's Actions tab
#  - a push that adds images straight into site/media or changes the scripts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/media/**"
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-gallery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Copy new and changed files from Google Drive into site/media.
      # Turn this off after the Drive account is closed: repo Settings > Variables > DRIVE_SYNC_ENABLED = false
      - name: Mirror Google Drive -> site/media
        if: ${{ vars.DRIVE_SYNC_ENABLED != 'false' && github.event_name != 'push' }}
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          ALLOW_MASS_DELETE: ${{ vars.ALLOW_MASS_DELETE }}
        run: python scripts/sync_drive.py

      - name: Build thumbnails + gallery list
        run: python scripts/build_manifest.py

      # A new commit makes Cloudflare publish the site again (about a minute).
      - name: Save changes
        run: |
          git config user.name  "bos-gallery-bot"
          git config user.email "bos-gallery-bot@users.noreply.github.com"
          git add -A site
          if [ -d .sync ]; then git add -A .sync; fi
          if git diff --cached --quiet; then
            echo "Nothing new in Drive."
          else
            git commit -m "Gallery sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
